name: Deploy

# Builds the site and replaces the contents of gh-pages with the output.
#
# That is all this needs to do. GitHub Pages is configured to serve the
# gh-pages branch, so GitHub runs its own "pages build and deployment" job
# whenever that branch changes - which is the deploy you already have. This
# workflow only has to put the built files there.

on:
  push:
    branches: [main]
  workflow_dispatch:

# One publish at a time; a newer push supersedes an in-flight one.
concurrency:
  group: publish-gh-pages
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish the build output to gh-pages
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch --no-tags --depth=1 origin gh-pages

          GIT_INDEX_FILE="$(mktemp -d)/index"; export GIT_INDEX_FILE

          git --work-tree=dist add -A
          tree="$(git write-tree)"
          parent="$(git rev-parse FETCH_HEAD)"

          : "${tree:?failed to write a tree from dist/}"
          : "${parent:?could not resolve the current gh-pages tip}"

          if [ "$tree" = "$(git rev-parse "${parent}^{tree}")" ]; then
            echo "Built output is identical to what is already published; nothing to do."
            exit 0
          fi

          commit="$(git commit-tree "$tree" -p "$parent" \
            -m "Build ${GITHUB_SHA} from ${GITHUB_REF_NAME}")"
          : "${commit:?commit-tree produced no commit}"

          git push origin "${commit}:refs/heads/gh-pages"
