name: Deploy

# Builds the site and replaces the contents of gh-pages with the output.
#
# That is all this needs to do. GitHub Pages is configured to serve the
# gh-pages branch, so GitHub runs its own "pages build and deployment" job
# whenever that branch changes - which is the deploy you already have. This
# workflow only has to put the built files there.

on:
  push:
    branches: [main]
  workflow_dispatch:

# One publish at a time; a newer push supersedes an in-flight one.
concurrency:
  group: publish-gh-pages
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Replace gh-pages with the build output
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Check gh-pages out beside the repo. Its history is kept; only the
          # files are swapped, so a bad deploy stays revertable.
          git fetch origin gh-pages:gh-pages
          git worktree add ../site gh-pages

          # Wipe everything except .git, then lay down the fresh build. This
          # removes files that no longer exist in dist/, which a plain copy
          # would leave behind. dist/ carries its own CNAME and .nojekyll from
          # public/, so the custom domain survives.
          find ../site -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
          cp -r dist/. ../site/

          cd ../site
          git add -A

          if git diff --cached --quiet; then
            echo "Built output is identical to what is already published; nothing to do."
            exit 0
          fi

          git commit -m "Build ${GITHUB_SHA} from ${GITHUB_REF_NAME}"
          git push origin gh-pages
